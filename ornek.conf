input {
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/drivers/ojdbc11.jar"
    jdbc_driver_class => "Java::oracle.jdbc.OracleDriver"

    jdbc_connection_string => "${ORACLE_JDBC_URL}"
    jdbc_user => "${ORACLE_USER}"
    jdbc_password => "${ORACLE_PASSWORD}"

    jdbc_fetch_size => 1000

    # Her 10 saniyede bir çalışır.
    # Logstash JDBC input interval/schedule destekler; aynı anda sadece biri kullanılmalı.
    interval => "10s"

    use_column_value => true
    tracking_column => "ID"
    tracking_column_type => "numeric"
    last_run_metadata_path => "/usr/share/logstash/data/oracle_my_table_last_run.yml"
    clean_run => false

    statement => "
      SELECT
        ID,
        COL1,
        COL2,
        STATUS,
        CREATED_AT,
        UPDATED_AT
      FROM MY_SCHEMA.MY_TABLE
      WHERE ID > :sql_last_value
      ORDER BY ID
    "

    lowercase_column_names => true
  }
}

filter {
  mutate {
    add_field => {
      "source_db" => "oracle26ai"
      "source_table" => "MY_SCHEMA.MY_TABLE"
    }
  }

  date {
    match => [ "updated_at", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
    timezone => "Europe/Istanbul"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "${ES_INDEX}"
    document_id => "%{id}"
  }

  stdout {
    codec => rubydebug
  }
}
